apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-scorer
  labels:
    app.kubernetes.io/name: hybrid-fraud-detection
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.app.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: hybrid-fraud-detection
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hybrid-fraud-detection
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: scorer
          image: {{ .Values.app.image }}
          imagePullPolicy: {{ .Values.app.imagePullPolicy }}
          ports:
            - containerPort: 8000
              protocol: TCP
          env:
            {{- if .Values.model.endpoint }}
            - name: MODEL_ENDPOINT
              value: {{ .Values.model.endpoint | quote }}
            {{- end }}
            - name: MODEL_NAME
              value: {{ .Values.model.name | default "granite-2b-cpu" | quote }}
            {{- if .Values.model.existingSecret }}
            - name: MODEL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.model.existingSecret | quote }}
                  key: {{ .Values.model.apiKeySecretKey | default "api-key" | quote }}
            {{- end }}
            - name: DEMO_MODE
              value: {{ if .Values.model.endpoint }}"false"{{ else }}"true"{{ end }}
            - name: RULE_WEIGHT
              value: {{ .Values.scoring.ruleWeight | quote }}
            - name: LLM_WEIGHT
              value: {{ .Values.scoring.llmWeight | quote }}
            - name: MAX_BATCH_SIZE
              value: {{ .Values.scoring.maxBatchSize | quote }}
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
