# GitHub Actions workflow template for Intel quickstarts
# Copy to .github/workflows/ in each quickstart repo

name: Lint and Test

on:
  workflow_dispatch:
    inputs:
      publish_candidate:
        description: Publish a signed, non-production intake candidate to GHCR
        type: boolean
        default: false
      expected_revision:
        description: Exact 40-character source commit to publish
        type: string
        required: false
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contracts:
    name: "Stage 0: Contracts"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r src/requirements.txt pytest openapi-spec-validator
      - run: make test-contracts

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check src/ tests/
      - run: bash -n demo.sh

  test:
    name: "Stages 2-4: Unit, Integration, and Benchmarks"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r src/requirements.txt pytest
      - run: make test-unit test-integration test-benchmarks

  compose-config:
    name: Compose Config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet

  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint chart/

  readme-check:
    name: "Stage 5: Publication"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest PyYAML
      - run: make test-publication

  showroom-build:
    name: Showroom Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build:showroom

  container-build:
    name: Container Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: podman build -t hybrid-fraud-detection:test -f src/Containerfile src/

  publish_candidate:
    name: "Manual intake candidate: build, SBOM, sign, verify"
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_candidate == true && github.ref == 'refs/heads/codex/hybrid-fraud-immutable-images' }}
    needs: [contracts, lint, test, compose-config, helm-lint, readme-check, showroom-build, container-build]
    runs-on: ubuntu-latest
    environment: intake-candidate-publish
    permissions:
      contents: read
      id-token: write
      packages: write
    env:
      IMAGE_REPOSITORY: ghcr.io/jkershawrh/hybrid-fraud-detection
      EXPECTED_REVISION: ${{ inputs.expected_revision }}
      PUBLISH_GATE: ${{ vars.CANDIDATE_PUBLISH_ENABLED }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Fail closed before registry writes
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_REVISION" =~ ^[0-9a-f]{40}$ || "$EXPECTED_REVISION" != "$GITHUB_SHA" ]]; then
            echo "Expected revision must equal the dispatched source commit" >&2
            exit 1
          fi
          if [[ "$PUBLISH_GATE" != true ]]; then
            echo "Protected intake-candidate-publish environment is not enabled" >&2
            exit 1
          fi
          if [[ "$GITHUB_REPOSITORY" != jkershawrh/hybrid-fraud-detection ]]; then
            echo "Candidate publication is restricted to the reviewed source repository" >&2
            exit 1
          fi
          if [[ ! "$GITHUB_RUN_ID" =~ ^[0-9]+$ || ! "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]; then
            echo "Invalid GitHub run identity" >&2
            exit 1
          fi
          echo "IMAGE_TAG=intake-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
      - name: Build the exact linux/amd64 source
        shell: bash
        run: |
          set -euo pipefail
          podman build --platform linux/amd64 \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            -t "localhost/hybrid-fraud-detection:$IMAGE_TAG" -f src/Containerfile src/
          podman run --rm --platform linux/amd64 --entrypoint python \
            "localhost/hybrid-fraud-detection:$IMAGE_TAG" -c \
            'from fastapi.testclient import TestClient; from scorer import app; c=TestClient(app); assert c.get("/ready").status_code == 200; assert c.post("/api/v1/score", json={"amount":50,"country":"US","category":"retail"}).status_code == 200'
      - name: Authenticate to GHCR using this repository's workflow token
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$REGISTRY_TOKEN"
          umask 077
          mkdir -p "$RUNNER_TEMP/registry-auth"
          printf '%s' "$REGISTRY_TOKEN" | podman login \
            --authfile "$RUNNER_TEMP/registry-auth/config.json" \
            --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          echo "DOCKER_CONFIG=$RUNNER_TEMP/registry-auth" >> "$GITHUB_ENV"
          echo "REGISTRY_AUTH_FILE=$RUNNER_TEMP/registry-auth/config.json" >> "$GITHUB_ENV"
      - name: Push one uniquely tagged candidate and capture its digest
        shell: bash
        run: |
          set -euo pipefail
          podman tag "localhost/hybrid-fraud-detection:$IMAGE_TAG" "$IMAGE_REPOSITORY:$IMAGE_TAG"
          podman push --authfile "$REGISTRY_AUTH_FILE" \
            --digestfile "$RUNNER_TEMP/image.digest" "$IMAGE_REPOSITORY:$IMAGE_TAG"
          digest="$(< "$RUNNER_TEMP/image.digest")"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Registry did not return an immutable image digest" >&2
            exit 1
          fi
          echo "IMAGE_REF=$IMAGE_REPOSITORY@$digest" >> "$GITHUB_ENV"
      - uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0
      - name: Generate an SBOM for the pushed digest
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.IMAGE_REF }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          output-file: ${{ runner.temp }}/candidate.spdx.json
          format: spdx-json
          upload-artifact: false
          upload-release-assets: false
      - name: Sign the digest and attest SBOM plus source identity
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/candidate.spdx.json"
          jq -n --arg repository "https://github.com/$GITHUB_REPOSITORY" \
            --arg revision "$GITHUB_SHA" --arg image "$IMAGE_REF" \
            --arg workflow "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{source_repository:$repository,source_revision:$revision,subject_image:$image,workflow_run:$workflow,build_platform:"linux/amd64"}' \
            > "$RUNNER_TEMP/source-provenance.json"
          cosign sign --yes "$IMAGE_REF"
          cosign attest --yes --type spdxjson \
            --predicate "$RUNNER_TEMP/candidate.spdx.json" "$IMAGE_REF"
          cosign attest --yes --type custom \
            --predicate "$RUNNER_TEMP/source-provenance.json" "$IMAGE_REF"
      - name: Verify exact GitHub workflow signer and subject
        shell: bash
        run: |
          set -euo pipefail
          identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/ci.yaml@refs/heads/codex/hybrid-fraud-immutable-images"
          issuer="https://token.actions.githubusercontent.com"
          cosign verify --certificate-identity="$identity" \
            --certificate-oidc-issuer="$issuer" "$IMAGE_REF" > /dev/null
          cosign verify-attestation --type spdxjson \
            --certificate-identity="$identity" --certificate-oidc-issuer="$issuer" \
            "$IMAGE_REF" > /dev/null
          cosign verify-attestation --type custom \
            --certificate-identity="$identity" --certificate-oidc-issuer="$issuer" \
            "$IMAGE_REF" > /dev/null
          {
            echo "Candidate image: $IMAGE_REF"
            echo "Source revision: $GITHUB_SHA"
            echo "Status: signed candidate only; no catalog activation"
          } >> "$GITHUB_STEP_SUMMARY"
