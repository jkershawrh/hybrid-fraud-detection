<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">Hybrid fraud scoring architecture on OpenShift</title><desc id="d">A participant submits synthetic transaction data to a UI and FastAPI scorer. Deterministic rules always run. Only ambiguous cases call a CPU-hosted model through an OpenAI-compatible endpoint. Results expose rule, model, final score, mode, latency, and disclaimer.</desc><defs><style>.b{fill:#fff;stroke:#151515;stroke-width:2}.p{fill:#eef8ff;stroke:#06c;stroke-width:3}.r{fill:#f3faf2;stroke:#3e8635;stroke-width:2}.m{fill:#fff4e5;stroke:#f0ab00;stroke-width:2}.t{font:600 20px sans-serif;fill:#151515}.s{font:15px sans-serif;fill:#3c3f42}.a{stroke:#06c;stroke-width:3;fill:none;marker-end:url(#x)}</style><marker id="x" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#06c"/></marker></defs><rect width="1200" height="650" fill="#fafafa"/><text x="600" y="38" text-anchor="middle" class="t" font-size="27">Explainable conditional inference on Red Hat OpenShift</text><rect x="35" y="250" width="190" height="115" rx="10" class="b"/><text x="130" y="290" text-anchor="middle" class="t">Participant</text><text x="130" y="320" text-anchor="middle" class="s">synthetic transaction</text><text x="130" y="344" text-anchor="middle" class="s">UI or API</text><rect x="265" y="85" width="660" height="500" rx="15" class="p"/><text x="292" y="120" class="t">Participant OpenShift namespace</text><rect x="310" y="165" width="250" height="105" rx="8" class="b"/><text x="435" y="205" text-anchor="middle" class="t">FastAPI scorer</text><text x="435" y="235" text-anchor="middle" class="s">validation + orchestration</text><rect x="625" y="150" width="250" height="135" rx="8" class="r"/><text x="750" y="190" text-anchor="middle" class="t">Rule engine</text><text x="750" y="220" text-anchor="middle" class="s">always runs</text><text x="750" y="246" text-anchor="middle" class="s">signals + rule score</text><rect x="310" y="370" width="250" height="125" rx="8" class="m"/><text x="435" y="410" text-anchor="middle" class="t">Routing policy</text><text x="435" y="440" text-anchor="middle" class="s">extreme → skip model</text><text x="435" y="466" text-anchor="middle" class="s">ambiguous → call model</text><rect x="625" y="365" width="250" height="140" rx="8" class="b"/><text x="750" y="405" text-anchor="middle" class="t">Structured response</text><text x="750" y="435" text-anchor="middle" class="s">rule + model + final</text><text x="750" y="461" text-anchor="middle" class="s">signals + mode + latency</text><text x="750" y="487" text-anchor="middle" class="s">educational disclaimer</text><rect x="965" y="150" width="205" height="130" rx="8" class="m"/><text x="1068" y="190" text-anchor="middle" class="t">Model endpoint</text><text x="1068" y="220" text-anchor="middle" class="s">OpenAI-compatible</text><text x="1068" y="246" text-anchor="middle" class="s">CPU inference</text><rect x="965" y="390" width="205" height="120" rx="8" class="b"/><text x="1068" y="430" text-anchor="middle" class="t">Human reviewer</text><text x="1068" y="460" text-anchor="middle" class="s">interprets evidence</text><text x="1068" y="486" text-anchor="middle" class="s">owns real decisions</text><path d="M225 307H310" class="a"/><path d="M560 215H625" class="a"/><path d="M750 285C720 325 550 330 500 370" class="a"/><path d="M560 432H625" class="a"/><path d="M560 400C700 325 880 260 965 220" class="a"/><path d="M965 255C900 300 840 330 800 365" class="a"/><path d="M875 440H965" class="a"/><text x="600" y="620" text-anchor="middle" class="s">The model contributes only on the ambiguous path; every response identifies what actually ran.</text></svg>
