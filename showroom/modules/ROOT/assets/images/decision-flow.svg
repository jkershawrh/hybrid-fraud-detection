<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="t d"><title id="t">Conditional rule and model decision flow</title><desc id="d">Validated synthetic transaction fields enter a deterministic rule engine. Scores at or below ten and at or above ninety skip model inference. Scores between those thresholds receive a bounded model score and a weighted combination. Every path returns explanation fields and a disclaimer.</desc><defs><style>.b{fill:#fff;stroke:#151515;stroke-width:2}.g{fill:#f3faf2;stroke:#3e8635;stroke-width:2}.o{fill:#fff4e5;stroke:#f0ab00;stroke-width:2}.t{font:600 19px sans-serif;fill:#151515}.s{font:15px sans-serif;fill:#3c3f42}.a{stroke:#06c;stroke-width:3;fill:none;marker-end:url(#x)}</style><marker id="x" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#06c"/></marker></defs><rect width="1200" height="610" fill="#fafafa"/><text x="600" y="38" text-anchor="middle" class="t" font-size="27">The routing decision is visible and testable</text><rect x="40" y="230" width="195" height="100" rx="45" class="b"/><text x="138" y="270" text-anchor="middle" class="t">Validate input</text><text x="138" y="298" text-anchor="middle" class="s">synthetic fields only</text><rect x="285" y="215" width="220" height="130" rx="10" class="g"/><text x="395" y="255" text-anchor="middle" class="t">Apply rules</text><text x="395" y="285" text-anchor="middle" class="s">base score + signals</text><text x="395" y="311" text-anchor="middle" class="s">always executes</text><polygon points="620,190 755,280 620,370 485,280" fill="#eef8ff" stroke="#06c" stroke-width="3"/><text x="620" y="268" text-anchor="middle" class="t">Rule score</text><text x="620" y="296" text-anchor="middle" class="s">≤10 or ≥90?</text><rect x="830" y="95" width="300" height="125" rx="10" class="g"/><text x="980" y="135" text-anchor="middle" class="t">Yes: rule-only path</text><text x="980" y="165" text-anchor="middle" class="s">skip model; retain score</text><text x="980" y="191" text-anchor="middle" class="s">record explicit reason</text><rect x="820" y="350" width="320" height="145" rx="10" class="o"/><text x="980" y="390" text-anchor="middle" class="t">No: hybrid path</text><text x="980" y="420" text-anchor="middle" class="s">request bounded JSON score</text><text x="980" y="446" text-anchor="middle" class="s">60% rule + 40% model</text><text x="980" y="472" text-anchor="middle" class="s">fallback to rule if unavailable</text><rect x="455" y="465" width="330" height="105" rx="10" class="b"/><text x="620" y="505" text-anchor="middle" class="t">Return explainable result</text><text x="620" y="535" text-anchor="middle" class="s">signals, component scores, mode, latency, disclaimer</text><path d="M235 280H285" class="a"/><path d="M505 280H485" class="a"/><path d="M725 225C770 175 790 158 830 158" class="a"/><path d="M725 335C770 390 785 420 820 420" class="a"/><path d="M960 220C920 285 850 440 785 490" class="a"/><path d="M820 455C805 470 795 480 785 492" class="a"/><text x="775" y="165" class="s">yes</text><text x="770" y="390" class="s">no</text></svg>
