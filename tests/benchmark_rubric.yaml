schema_version: quickstart.redhat.com/benchmark-rubric/v1
version: "1.1"
description: Performance validation for hybrid fraud detection scoring.
verification_policy:
  verified_means: Measured by a live endpoint in the target environment.
  public_claim_rules:
    - Do not publish speedup claims unless the claim registry marks them verified.
    - Present unmeasured behavior as configured, not measured.
    - Use estimate language for cost claims.
run_modes:
  - id: local
    requires_cluster: false
  - id: compose
    requires:
      - podman
      - compose
  - id: openshift
    requires:
      - oc
      - helm
benchmarks:
  - id: scoring-latency-demo
    description: Score one ambiguous synthetic transaction in demo mode.
    maximum_ms: 500
    required: true
    required_fields:
      - risk_score
      - risk_level
      - latency_ms
      - model
  - id: scoring-latency-model-skip
    description: Score one high-confidence synthetic transaction without a model call.
    maximum_ms: 10
    required: true
    required_fields:
      - risk_score
      - llm_skipped
      - skip_reason
  - id: scoring-latency-live
    description: Score one ambiguous synthetic transaction through the configured live model.
    maximum_ms: 5000
    required: false
    required_fields:
      - risk_score
      - risk_level
      - latency_ms
      - model
      - llm_score
  - id: batch-throughput-100
    description: Score a batch of 100 synthetic transactions.
    maximum_ms: 5000
    required: true
    required_fields:
      - results
      - total
      - avg_latency_ms
  - id: skip-rate-measurement
    description: Report the measured model skip rate over a mixed synthetic distribution.
    sample_size: 1000
    required: false
    required_fields:
      - llm_skip_rate_pct
      - llm_calls
      - llm_skips
