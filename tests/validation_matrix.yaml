# Validation Matrix -- CDD -> TDD -> EDD
# Write tests RED, deploy until GREEN. Each stage gates the next.
# Adapt per quickstart: fill in technique-specific criteria in stage_2_unit.

stages:

  stage_0_contracts:
    description: "All API contracts defined and parseable"
    threshold: 100
    criteria:
      openapi_spec_valid:
        description: "OpenAPI spec validates against 3.1"
        points: 25
        required: true
      openapi_has_paths:
        description: "Spec defines at least one path with operations"
        points: 25
        required: true
      openapi_refs_resolve:
        description: "All $ref pointers resolve within the spec"
        points: 25
        required: true
      openapi_responses_defined:
        description: "Every operation has at least one response schema"
        points: 25
        required: true

  stage_1_infrastructure:
    description: "Containers build, services start, health checks pass"
    threshold: 90
    criteria:
      container_builds:
        description: "Containerfile builds successfully"
        points: 20
        required: true
      compose_stack_starts:
        description: "docker-compose stack starts with all health checks passing"
        points: 20
        required: true
      model_endpoint_responds:
        description: "Model serving endpoint returns expected model name"
        points: 20
        required: true
      no_hardcoded_secrets:
        description: "No API keys, passwords, or secrets in source code"
        points: 20
        required: true
      helm_template_renders:
        description: "Helm chart renders cleanly with default values"
        points: 20
        required: true

  stage_2_unit:
    description: "Hybrid fraud scoring technique works in isolation"
    threshold: 90
    criteria:
      rule_engine_signals:
        description: "Rule engine detects high_amount, high_risk_country, high_risk_category, round_amount, and crypto signals"
        points: 20
        required: true
      llm_scoring:
        description: "LLM scorer produces a 0-100 risk score from model response"
        points: 15
        required: true
      weighted_combination:
        description: "Combined score = 0.6 * rule_score + 0.4 * llm_score"
        points: 20
        required: true
      conditional_skip_high:
        description: "LLM skipped when rule_score >= 90 (confident high risk)"
        points: 15
        required: true
      conditional_skip_low:
        description: "LLM skipped when rule_score <= 10 (confident low risk)"
        points: 15
        required: true
      skip_rate_stats:
        description: "Stats endpoint reports accurate LLM skip rate percentage"
        points: 15
        required: true

  stage_3_integration:
    description: "End-to-end flow works from API to scorer and back"
    threshold: 85
    criteria:
      full_user_flow:
        description: "POST /api/v1/score -> rule engine -> conditional LLM -> response"
        points: 25
        required: true
      response_has_real_metrics:
        description: "Response identifies the active scorer and reports measured latency"
        points: 15
        required: true
      no_hardcoded_latency:
        description: "No hardcoded ms/s values displayed as live measurements"
        points: 15
        required: true
      ai_transparency_labels:
        description: "AI-generated content labeled with persistent disclaimers"
        points: 10
        required: true
      health_endpoint:
        description: "Health endpoint returns service status + mode (demo/live)"
        points: 10
        required: true
      error_handling:
        description: "LLM timeout falls back to rule-only score gracefully"
        points: 10
        required: true
      compose_15_min:
        description: "docker compose up -> working demo in under 15 minutes"
        points: 15
        required: true

  stage_4_benchmarks:
    description: "Performance claims meet thresholds"
    threshold: 80
    criteria:
      scoring_latency_demo:
        description: "Single transaction scoring latency < 500ms in demo mode"
        points: 30
        required: true
      scoring_latency_llm_skip:
        description: "Scoring with LLM skip completes < 10ms (rule engine only)"
        points: 25
        required: true
      batch_throughput:
        description: "Batch of 100 transactions scores in < 5 seconds"
        points: 25
        required: true
      skip_rate_measured:
        description: "Measured skip rate reported in stats endpoint"
        points: 20
        required: false

  stage_5_publication:
    description: "README passes automated review with zero BLOCKERs"
    threshold: 100
    criteria:
      title_format:
        description: "H1 title <= 64 chars, starts with action verb"
        points: 10
        required: true
      short_description:
        description: "Short description <= 160 chars"
        points: 10
        required: true
      required_sections:
        description: "All required README sections present in correct order"
        points: 15
        required: true
      architecture_diagram:
        description: "Architecture diagram in docs/images/ with alt text"
        points: 10
        required: true
      no_credentials:
        description: "No hardcoded credentials in repo"
        points: 15
        required: true
      links_resolve:
        description: "All links (internal + external) resolve"
        points: 10
        required: true
      industry_tag:
        description: "Industry tag from approved list"
        points: 10
        required: true
      tag_format:
        description: "Tags as bulleted list with bold key and normal value"
        points: 5
        required: true
      opl_compliance:
        description: "Red Hat trademark first-mention-only rule"
        points: 10
        required: true
      accessibility:
        description: "WCAG 2.2 AA: heading nesting, alt text, descriptive links"
        points: 5
        required: true
