schema_version: quickstart.redhat.com/validation-matrix/v1
stages:
  - id: stage-0-contracts
    name: Contracts
    method: CDD
    threshold: 100
    required: true
    checks:
      - openapi-spec-valid
      - openapi-paths-and-responses-defined
      - openapi-references-resolve
  - id: stage-1-infrastructure
    name: Infrastructure
    method: CBT
    threshold: 90
    required: true
    checks:
      - container-builds
      - compose-stack-starts
      - model-endpoint-responds
      - no-hardcoded-secrets
      - helm-template-renders
      - participant-ui-route-renders
  - id: stage-2-unit
    name: Hybrid scoring
    method: TDD
    threshold: 90
    required: true
    checks:
      - deterministic-rule-signals
      - structured-llm-score
      - weighted-combination
      - confident-high-and-low-skip-model
      - skip-rate-statistics
  - id: stage-3-integration
    name: End-to-end scoring
    method: EDD
    threshold: 85
    required: true
    checks:
      - api-rule-model-response-flow
      - measured-latency
      - ai-transparency-labels
      - model-timeout-fallback
      - participant-ui-to-scorer-flow
  - id: stage-4-benchmarks
    name: Performance evidence
    method: BDD
    threshold: 80
    required: true
    checks:
      - demo-scoring-below-500ms
      - rule-only-scoring-below-10ms
      - batch-100-below-5s
      - measured-skip-rate
  - id: stage-5-publication
    name: Publication and Showroom
    method: EDD
    threshold: 100
    required: true
    checks:
      - business-first-readme
      - architecture-and-alt-text
      - hands-on-showroom-journey
      - see-execute-verify-key-takeaway
      - approved-tags-and-accessibility
      - no-credentials
  - id: stage-6-launchpad-certification
    name: Launchpad lifecycle and scale
    method: EDD
    threshold: 100
    required: true
    checks:
      - immutable-image-and-source
      - one-seat-lifecycle-and-reclaim
      - five-seat-concurrency-and-isolation
      - intended-scale-capacity-and-model-load
      - zero-residue-reclaim
